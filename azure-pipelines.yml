trigger:
  branches:
    include:
      - main
      - develop

pr:
  branches:
    include:
      - main
      - develop

pool:
  vmImage: ubuntu-latest

stages:
  - stage: Validate
    displayName: Validate application
    jobs:
      - job: Backend
        displayName: Validate backend
        steps:
          - task: NodeTool@0
            displayName: Use Node.js 20
            inputs:
              versionSpec: '20.x'
          - script: |
              cd backend
              npm install --no-audit --no-fund
              npm test
            displayName: Check backend syntax

      - job: FrontendLint
        displayName: Lint frontend
        steps:
          - task: NodeTool@0
            displayName: Use Node.js 20
            inputs:
              versionSpec: '20.x'
          - script: |
              cd frontend
              npm install --no-audit --no-fund
              npm run lint
            displayName: Run frontend lint

  - stage: Build
    displayName: Build frontend
    dependsOn: Validate
    condition: succeeded()
    jobs:
      - job: FrontendBuild
        displayName: Build frontend bundle
        steps:
          - task: NodeTool@0
            displayName: Use Node.js 20
            inputs:
              versionSpec: '20.x'
          - script: |
              cd frontend
              npm install --no-audit --no-fund
              npm run build
            displayName: Build frontend
          - task: PublishPipelineArtifact@1
            displayName: Publish frontend artifact
            inputs:
              targetPath: 'frontend/dist'
              artifact: 'task-university-frontend'
              publishLocation: 'pipeline'
