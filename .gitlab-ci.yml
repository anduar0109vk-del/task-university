image: node:20

stages:
  - validate
  - build

cache:
  key:
    files:
      - frontend/package.json
      - backend/package.json
  paths:
    - frontend/node_modules/
    - backend/node_modules/

backend_syntax:
  stage: validate
  script:
    - cd backend
    - npm install --no-audit --no-fund
    - npm test

frontend_lint:
  stage: validate
  script:
    - cd frontend
    - npm install --no-audit --no-fund
    - npm run lint

frontend_build:
  stage: build
  needs:
    - frontend_lint
  script:
    - cd frontend
    - npm install --no-audit --no-fund
    - npm run build
  artifacts:
    name: task-university-frontend
    paths:
      - frontend/dist/
    expire_in: 7 days
