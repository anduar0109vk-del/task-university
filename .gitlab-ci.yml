image: node:20

stages:
  - validate
  - build
  - deploy

cache:
  key:
    files:
      - frontend/package.json
      - backend/package.json
  paths:
    - frontend/node_modules/
    - backend/node_modules/

backend_syntax:
  stage: validate
  script:
    - cd backend
    - npm install --no-audit --no-fund
    - npm test

frontend_lint:
  stage: validate
  script:
    - cd frontend
    - npm install --no-audit --no-fund
    - npm run lint

frontend_build:
  stage: build
  needs:
    - frontend_lint
  script:
    - cd frontend
    - npm install --no-audit --no-fund
    - npm run build
  artifacts:
    name: task-university-frontend
    paths:
      - frontend/dist/
    expire_in: 7 days

pages:
  stage: deploy
  needs:
    - frontend_build
  script:
    - mkdir -p public
    - cp -r frontend/dist/. public/
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
